# Publishes psyspin to PyPI.
#
# Two modes are supported, pick the one you set up on PyPI:
#
#  A) Trusted publishing (recommended, no secrets)
#     - The "psyspin" project already exists on PyPI, so this is NOT a
#       pending publisher: go to https://pypi.org/manage/project/psyspin/settings/publishing/
#       and add a trusted publisher there with
#       owner = armanetti, repo = psyspin,
#       workflow filename = publish.yml,
#       environment = pypi (matches the `environment:` key below).
#     - Push a tag like v1.1.2 -> the package is built and uploaded automatically.
#
#  B) API-token publishing (fallback)
#     - On PyPI: Account settings -> API tokens -> create a project-scoped token.
#     - On GitHub: Settings -> Secrets and variables -> Actions -> add PYPI_API_TOKEN.
#     - Uncomment the `password:` line in the publish step below.

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/psyspin/
    permissions:
      id-token: write  # required for trusted publishing (OIDC)
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # For trusted publishing leave `password:` commented out.
          # For API-token publishing uncomment the next line:
          # password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true
